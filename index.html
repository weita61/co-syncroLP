<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CO-SYNCHRO</title>
  <meta name="description" content="Chemistry in one second. AI orchestrates human connection through scanning." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <header id="site-header" class="site-header">
    <div class="header-inner">
      <a class="brand" href="#hero" aria-label="CO-SYNCHRO home">
        <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
          <circle cx="12" cy="18" r="5" />
          <circle cx="24" cy="18" r="5" />
          <path d="M16.8 18h2.4" />
        </svg>
        <span></span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation"></nav>
      <a class="btn btn-glass header-cta" href="#cta"></a>
    </div>
  </header>

  <main>
    <section id="hero" class="hero-section" aria-labelledby="hero-title">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>
      <div class="mobile-phone-fallback" aria-hidden="true">
        <div class="fallback-phone fallback-phone-a"></div>
        <div class="fallback-phone fallback-phone-b"></div>
        <span></span><span></span><span></span>
      </div>
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="hero-eyebrow"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-sub"></p>
          <div class="button-row">
            <a class="btn btn-primary hero-cta-primary" href="#solution"></a>
            <a class="btn btn-glass hero-cta-secondary" href="#cta"></a>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="hero-orbit"></div>
          <div class="hero-phone-outline phone-left"></div>
          <div class="hero-phone-outline phone-right"></div>
        </div>
      </div>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </section>

    <section id="problem" class="page-section" aria-labelledby="problem-title">
      <div class="container">
        <div class="section-kicker"></div>
        <h2 id="problem-title"></h2>
        <div class="cards-grid problem-cards"></div>
      </div>
    </section>

    <section id="solution" class="page-section solution-section" aria-labelledby="solution-title">
      <div class="container solution-grid">
        <div class="solution-copy">
          <div class="section-kicker"></div>
          <h2 id="solution-title"></h2>
          <p class="solution-body"></p>
        </div>
        <div class="scan-demo glass-panel" aria-hidden="true">
          <div class="scan-phone phone-a"><span></span></div>
          <div class="scan-contact">
            <i></i><i></i><i></i>
          </div>
          <div class="scan-phone phone-b"><span></span></div>
        </div>
      </div>
    </section>

    <section id="how-it-works" class="page-section how-section" aria-labelledby="how-title">
      <div class="container">
        <div class="section-kicker"></div>
        <h2 id="how-title"></h2>
        <div class="steps-wrap">
          <div class="steps-progress" aria-hidden="true"><span></span></div>
          <div class="steps-grid"></div>
        </div>
      </div>
    </section>

    <section id="use-cases" class="page-section" aria-labelledby="use-title">
      <div class="container">
        <div class="section-kicker"></div>
        <h2 id="use-title"></h2>
        <div class="cards-grid use-cases-grid"></div>
      </div>
    </section>

    <section id="data" class="page-section data-section" aria-labelledby="data-title">
      <div class="container">
        <div class="section-kicker"></div>
        <h2 id="data-title"></h2>
        <div class="metrics-grid"></div>
      </div>
    </section>

    <section id="cta" class="page-section cta-section" aria-labelledby="cta-title">
      <div class="container">
        <div class="cta-panel">
          <div class="section-kicker"></div>
          <h2 id="cta-title"></h2>
          <p class="cta-body"></p>
          <a class="btn btn-cta btn-cta-large" href="mailto:info@example.com"></a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p class="footer-copy"></p>
  </footer>
</body>
</html>
